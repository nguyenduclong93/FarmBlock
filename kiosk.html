<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chấm công</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#13331C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0F5E8;
    --card: #FFFFFF;
    --card-border: #D6E4CC;
    --text: #13331C;
    --text-dim: #5C7A5F;
    --green: #86C046;
    --green-dark: #4C9A3B;
    --red: #C0392B;
    --border: #D6E4CC;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #app { height: 100vh; display: flex; flex-direction: column; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 2.2vh 4vw 1.6vh 4vw; flex-shrink: 0;
  }
  header .brand { display: flex; align-items: center; gap: 2vw; }
  header .brand img { height: 3.6vh; display: block; }
  header .brand-name { font-size: 2vh; font-weight: 800; letter-spacing: 0.02em; color: var(--text); }
  header .clock { font-size: 2.4vh; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }

  .screen { flex: 1; display: none; flex-direction: column; overflow: hidden; padding: 0 4vw 3vh; }
  .screen.active { display: flex; }

  .cam-frame {
    position: relative; background: #DCE8D5; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    height: 17vh; margin-bottom: 2vh; overflow: hidden; flex-shrink: 0;
  }
  #video { width: 100%; height: 100%; object-fit: cover; }
  .cam-placeholder { font-size: 5vh; color: #9BB795; }
  .cam-guide {
    position: absolute; width: 22vw; height: 13vh;
    border: 1.5px solid rgba(19,51,28,0.22); border-radius: 50% / 40%; pointer-events: none;
  }
  .cam-error {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    text-align: center; padding: 3vh; color: var(--text-dim); font-size: 1.8vh; background: #DCE8D5;
  }

  #name-list {
    flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1.2vh;
    padding-right: 4px; margin-bottom: 2vh; min-height: 0;
  }
  #name-list::-webkit-scrollbar { width: 4px; }
  #name-list::-webkit-scrollbar-thumb { background: #B4D9A0; border-radius: 4px; }
  #name-list::-webkit-scrollbar-track { background: transparent; }

  .name-item {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 14px;
    padding: 1.6vh 3vw; display: flex; align-items: center; gap: 3vw;
    cursor: pointer; transition: all .12s ease;
  }
  .name-item.selected { border: 1.5px solid var(--green); background: #F5FAEF; }
  .name-avatar {
    width: 4.4vh; height: 4.4vh; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7vh; font-weight: 700; color: #FFFFFF;
  }
  .name-text { font-size: 2vh; font-weight: 600; color: var(--text); }
  .load-msg { color: var(--text-dim); font-size: 1.9vh; padding: 1vh; }

  .action-row { display: flex; gap: 3vw; flex-shrink: 0; }
  .action-btn {
    flex: 1; border: none; border-radius: 16px; padding: 2.4vh 0;
    display: flex; align-items: center; justify-content: center; gap: 1.6vw;
    font-size: 2vh; font-weight: 800; cursor: pointer; opacity: 0.35; pointer-events: none;
    transition: opacity .15s ease;
  }
  .action-btn.ready { opacity: 1; pointer-events: auto; }
  .action-btn.in { background: var(--green-dark); color: #FFFFFF; }
  .action-btn.out { background: var(--red); color: #FFFFFF; }
  .action-btn i { font-size: 2.2vh; }

  #screen-confirm { align-items: center; justify-content: center; position: relative; }
  .cancel-link { position: absolute; top: 2.5vh; left: 4vw; font-size: 1.9vh; color: var(--text-dim); cursor: pointer; }
  #confirm-photo {
    width: 34vh; height: 34vh; border-radius: 18px; object-fit: cover;
    border: 1px solid var(--card-border); margin-bottom: 2.2vh;
  }
  #confirm-info { font-size: 2.6vh; font-weight: 700; margin-bottom: .4vh; }
  #confirm-sub { font-size: 1.9vh; color: var(--text-dim); margin-bottom: 3vh; }
  .confirm-actions { display: flex; gap: 3vw; }
  .btn { border: none; border-radius: 14px; font-size: 2.1vh; font-weight: 700; padding: 1.8vh 5vw; cursor: pointer; }
  .btn.primary { background: var(--green-dark); color: #FFFFFF; }
  .btn.secondary { background: transparent; border: 1px solid var(--card-border); color: var(--text-dim); font-weight: 500; }

  #screen-result { align-items: center; justify-content: center; text-align: center; }
  #result-icon { font-size: 10vh; margin-bottom: 2vh; }
  #result-name { font-size: 2.8vh; font-weight: 700; }
  #result-status { font-size: 2.4vh; margin-top: 1vh; }
  #result-status.warn { color: var(--red); }
  #result-status.ok { color: var(--green-dark); }
</style>
</head>

      <div class="brand-name">FARMBLOCK</div>
    </div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <div class="screen active" id="screen-main">
    <div class="cam-frame">
      <video id="video" autoplay playsinline muted></video>
      <div class="cam-guide"></div>
      <div class="cam-error" id="cam-error">Không mở được camera.<br>Kiểm tra quyền camera của trình duyệt.</div>
    </div>

    <div id="name-list"><div class="load-msg">Đang tải danh sách nhân sự…</div></div>

    <div class="action-row">
      <button class="action-btn in" id="btn-checkin" onclick="thucHienCheck('Check In')">
        <i class="ti ti-login-2" aria-hidden="true"></i> CHECK IN
      </button>
      <button class="action-btn out" id="btn-checkout" onclick="thucHienCheck('Check Out')">
        <i class="ti ti-logout-2" aria-hidden="true"></i> CHECK OUT
      </button>
    </div>
  </div>

  <div class="screen" id="screen-confirm">
    <div class="cancel-link" onclick="huyVeMain()">✕ Huỷ</div>
    <img id="confirm-photo" alt="ảnh vừa chụp">
    <div id="confirm-info"></div>
    <div id="confirm-sub"></div>
    <div class="confirm-actions">
      <button class="btn secondary" onclick="chupLai()">Chụp lại</button>
      <button class="btn primary" onclick="xacNhanGui()">XÁC NHẬN</button>
    </div>
  </div>

  <div class="screen" id="screen-result">
    <div id="result-icon">✅</div>
    <div id="result-name"></div>
    <div id="result-status"></div>
  </div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script>
/* ====== CẤU HÌNH — sửa dòng dưới sau khi deploy Apps Script ====== */
const CONFIG = {
  APPS_SCRIPT_URL: "https://script.google.com/macros/s/AKfycbx4ZkVoqwWiTelsiOX6L2-zvs3JwGe4QpMeo0FcBTX4sgkOIR8Fdg5cTHn9qajNtNzb/exec"
};
/* =================================================================== */

const MAU_AVATAR = ['#86C046', '#316879', '#8C6D3F', '#7A4F8C', '#C0392B', '#4C9A3B'];
function mauAvatar(ten) {
  let h = 0;
  for (let i = 0; i < ten.length; i++) h = (h * 31 + ten.charCodeAt(i)) % MAU_AVATAR.length;
  return MAU_AVATAR[Math.abs(h) % MAU_AVATAR.length];
}
function chuCaiDau(ten) {
  const parts = ten.trim().split(/\s+/);
  const last = parts[parts.length - 1] || '';
  const first = parts.length > 1 ? parts[0] : '';
  return ((first[0] || '') + (last[0] || '')).toUpperCase();
}

let danhSachTen = [];
let tenDangChon = null;
let stream = null;
let anhVuaChup = null;
let loaiDangChup = null;

function capNhatDongHo() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('vi-VN', { hour12: false });
}
setInterval(capNhatDongHo, 1000);
capNhatDongHo();

async function moCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    document.getElementById('video').srcObject = stream;
    document.getElementById('cam-error').style.display = 'none';
  } catch (err) {
    document.getElementById('cam-error').style.display = 'flex';
  }
}
function dungCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}
moCamera();

async function taiDanhSach() {
  const list = document.getElementById('name-list');
  try {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL);
    const data = await res.json();
    danhSachTen = data.names || [];
    renderDanhSach();
  } catch (err) {
    list.innerHTML = '<div class="load-msg">Không tải được danh sách (mất mạng hoặc lỗi kết nối).<br>Đang tự động thử lại…</div>';
    setTimeout(taiDanhSach, 5000);
  }
}
function renderDanhSach() {
  const list = document.getElementById('name-list');
  list.innerHTML = '';
  if (danhSachTen.length === 0) {
    list.innerHTML = '<div class="load-msg">Chưa có nhân sự trong Danh sách.</div>';
    return;
  }
  danhSachTen.forEach(ten => {
    const item = document.createElement('div');
    item.className = 'name-item' + (ten === tenDangChon ? ' selected' : '');
    const av = document.createElement('div');
    av.className = 'name-avatar';
    av.style.background = mauAvatar(ten);
    av.textContent = chuCaiDau(ten);
    const txt = document.createElement('div');
    txt.className = 'name-text';
    txt.textContent = ten;
    item.appendChild(av);
    item.appendChild(txt);
    item.onclick = () => chonTen(ten);
    list.appendChild(item);
  });
}
taiDanhSach();

function chonTen(ten) {
  tenDangChon = ten;
  renderDanhSach();
  capNhatNutAction();
}
function capNhatNutAction() {
  const sanSang = !!tenDangChon;
  document.getElementById('btn-checkin').classList.toggle('ready', sanSang);
  document.getElementById('btn-checkout').classList.toggle('ready', sanSang);
}

function thucHienCheck(loai) {
  if (!tenDangChon) return;
  const video = document.getElementById('video');
  if (!video.videoWidth) {
    document.getElementById('cam-error').style.display = 'flex';
    return;
  }
  loaiDangChup = loai;
  const size = 260;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const side = Math.min(video.videoWidth, video.videoHeight);
  const sx = (video.videoWidth - side) / 2;
  const sy = (video.videoHeight - side) / 2;
  ctx.drawImage(video, sx, sy, side, side, 0, 0, size, size);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.5);
  anhVuaChup = dataUrl.split(',')[1];

  document.getElementById('confirm-photo').src = dataUrl;
  document.getElementById('confirm-info').textContent = tenDangChon;
  document.getElementById('confirm-sub').textContent = loai === 'Check In' ? 'Check In' : 'Check Out';
  chuyenManHinh('screen-confirm');
}

function chupLai() {
  chuyenManHinh('screen-main');
}
function huyVeMain() {
  tenDangChon = null;
  loaiDangChup = null;
  anhVuaChup = null;
  renderDanhSach();
  capNhatNutAction();
  chuyenManHinh('screen-main');
}
function chuyenManHinh(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function xacNhanGui() {
  chuyenManHinh('screen-result');
  document.getElementById('result-icon').textContent = '⏳';
  document.getElementById('result-name').textContent = tenDangChon;
  document.getElementById('result-status').textContent = 'Đang gửi…';
  document.getElementById('result-status').className = '';

  try {
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ ten: tenDangChon, loai: loaiDangChup, anh: anhVuaChup })
    });
    const data = await res.json();

    if (data.ok) {
      const canhBao = data.trangThai !== 'Đúng giờ';
      document.getElementById('result-icon').textContent = canhBao ? '⚠️' : '✅';
      document.getElementById('result-status').textContent = data.trangThai;
      document.getElementById('result-status').className = canhBao ? 'warn' : 'ok';
    } else {
      document.getElementById('result-icon').textContent = '❌';
      document.getElementById('result-status').textContent = data.error || 'Lỗi không xác định';
    }
  } catch (err) {
    document.getElementById('result-icon').textContent = '❌';
    document.getElementById('result-status').textContent = 'Không gửi được, kiểm tra mạng.';
  }

  setTimeout(() => {
    huyVeMain();
    taiDanhSach();
  }, 2800);
}

document.body.addEventListener('click', function once() {
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  document.body.removeEventListener('click', once);
}, { once: true });
</script>
</body>
